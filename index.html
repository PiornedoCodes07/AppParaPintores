<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Pintores</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <script defer src="/src/js/script.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="/src/assets/icon.png" type="image/x-icon">
    <!--Biblioteca ToastifyJs-->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js" defer></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
</head>
<body id="body">
    <header>
        <svg id="navIcon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
        <nav id="navBar">
            <div id="icon"></div>
            <button onclick=toggleSubMenu(this) class="dropdown-btn">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"><path d="M346-140 100-386q-10-10-15-22t-5-25q0-13 5-25t15-22l230-229-106-106 62-65 400 400q10 10 14.5 22t4.5 25q0 13-4.5 25T686-386L440-140q-10 10-22 15t-25 5q-13 0-25-5t-22-15Zm47-506L179-432h428L393-646Zm399 526q-36 0-61-25.5T706-208q0-27 13.5-51t30.5-47l42-54 44 54q16 23 30 47t14 51q0 37-26 62.5T792-120Z"/></svg>
                <span>Tipos de Tintas</span>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed"><path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z"/></svg>
            </button>
            <ul class="sub-menu">
                <div>
                    <li>
                        <h3>Massa Corrida</h3>
                        <input class="inputNav" id="mc" type="number" min="0" step="0.01">
                    </li>
                    <li>
                        <h3>Tinta textura</h3>
                        <input class="inputNav" id="tt" type="number" min="0" step="0.01">
                    </li>
                    <li>
                        <h3>Grafiato</h3>
                        <input class="inputNav" id="g" type="number" min="0" step="0.01">
                    </li>
                    <li>
                        <h3>Tinta Acrilica</h3>
                        <input class="inputNav" id="ta" type="number" min="0" step="0.01">
                    </li>
                </div>
            </ul>
        </nav>
    </header>
    <main id="main">
        <div id="contentMain">
            <div>
                <h2>Altura:</h2>
                <input id="width" type="number" min="0" step="0.01">
                <select id="larguraMedida" name="largura">
                    <option value="M">M</option>
                    <option value="Cm">Cm</option>
                    <option value="MM">MM</option>
                </select>
                <h2>Comprimento:</h2>
                <input id="length" type="number" min="0" step="0.01">
                <select id="comprimentoMedida" name="comprimento">
                    <option value="M">M</option>
                    <option value="Cm">Cm</option>
                    <option value="MM">MM</option>
                </select>
                <h2>Tipo da Tinta:</h2>
                <select id="typePaint" name="tintas">
                    <option value="mc">Massa Corrida</option>
                    <option value="tt">Tinta textura</option>
                    <option value="g">Grafiato</option>
                    <option value="ta">Tinta Acrilica</option>
                </select>
            </div>
            <button id="btnSubmit">Calcular</button>
        </div>
    </main>
</body>
</html>
