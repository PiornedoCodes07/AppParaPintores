<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Pintores</title>
    <link rel="stylesheet" href="/src/css/style.css" />
    <script defer src="/src/js/script.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="/src/assets/icon.png" type="image/x-icon" />
    <!--Biblioteca ToastifyJs-->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
      defer
    ></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <!--LINK DO GOOGLE ADS-->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7499666943447791"
     crossorigin="anonymous"></script>
  </head>
  <body id="body">
    <header>
      <svg
        id="navIcon"
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#e8eaed"
      >
        <path
          d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
        />
      </svg>
      <nav id="navBar">
        <div id="icon"></div>
        <button onclick="toggleSubMenu(this)" class="dropdown-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#e8eaed"
          >
            <path
              d="M346-140 100-386q-10-10-15-22t-5-25q0-13 5-25t15-22l230-229-106-106 62-65 400 400q10 10 14.5 22t4.5 25q0 13-4.5 25T686-386L440-140q-10 10-22 15t-25 5q-13 0-25-5t-22-15Zm47-506L179-432h428L393-646Zm399 526q-36 0-61-25.5T706-208q0-27 13.5-51t30.5-47l42-54 44 54q16 23 30 47t14 51q0 37-26 62.5T792-120Z"
            />
          </svg>
          <span>Tipos de Tintas</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#e8eaed"
          >
            <path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z" />
          </svg>
        </button>
        <ul class="sub-menu">
          <div>
            <li>
              <h3>Massa Corrida</h3>
              <div class="inputSection">
                <input
                  id="massaCorridaMin"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="min"
                />
                <input
                  id="massaCorridaMed"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="med"
                />
                <input
                  id="massaCorridaMax"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="max"
                />
              </div>
            </li>
            <li>
              <h3>Tinta textura</h3>
              <div class="inputSection">
                <input
                  id="tintaTexturaMin"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="min"
                />
                <input
                  id="tintaTexturaMed"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="med"
                />
                <input
                  id="tintaTexturaMax"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="max"
                />
              </div>
            </li>
            <li>
              <h3>Grafiato</h3>
              <div class="inputSection">
                <input
                  id="grafiatoMin"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="min"
                />
                <input
                  id="grafiatoMed"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="med"
                />
                <input
                  id="grafiatoMax"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="max"
                />
              </div>
            </li>
            <li>
              <h3>Tinta Acrilica</h3>
              <div class="inputSection">
                <input
                  id="tintaAcrilicaMin"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="min"
                />
                <input
                  id="tintaAcrilicaMed"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="med"
                />
                <input
                  id="tintaAcrilicaMax"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="max"
                />
              </div>
            </li>
          </div>
        </ul>
      </nav>
    </header>
    <main id="main">
      <div id="contentMain">
        <div>
          <h2>Altura:</h2>
          <input id="width" type="number" min="0" step="0.01" />
          <select id="larguraMedida" name="largura">
            <option value="M">M</option>
            <option value="Cm">Cm</option>
            <option value="MM">MM</option>
          </select>
          <h2>Comprimento:</h2>
          <input id="length" type="number" min="0" step="0.01" />
          <select id="comprimentoMedida" name="comprimento">
            <option value="M">M</option>
            <option value="Cm">Cm</option>
            <option value="MM">MM</option>
          </select>
          <h2>Tipo da Tinta:</h2>
          <select id="typePaint" name="tintas">
            <option value="mc">Massa Corrida</option>
            <option value="tt">Tinta textura</option>
            <option value="g">Grafiato</option>
            <option value="ta">Tinta Acrilica</option>
          </select>
        </div>
        <!-- Botões para o perfil de cliente -->
        <div id="buttonsPerfil">
          <button id="perfil-amarelo">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#e8eaed"
            >
              <path
                d="M640-520v-80h240v80H640Zm-280 40q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm80-80h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T440-640q0-33-23.5-56.5T360-720q-33 0-56.5 23.5T280-640q0 33 23.5 56.5T360-560Zm0-80Zm0 400Z"
              />
            </svg>
          </button>
          <button id="perfil-verde">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#e8eaed"
            >
              <path
                d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0-80Zm0 400Z"
              />
            </svg>
          </button>
          <button id="perfil-azul">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#e8eaed"
            >
              <path
                d="M720-400v-120H600v-80h120v-120h80v120h120v80H800v120h-80Zm-360-80q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm80-80h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T440-640q0-33-23.5-56.5T360-720q-33 0-56.5 23.5T280-640q0 33 23.5 56.5T360-560Zm0-80Zm0 400Z"
              />
            </svg>
          </button>
        </div>
        <button id="btnSubmit">Calcular</button>
      </div>
    </main>
  </body>
</html>
