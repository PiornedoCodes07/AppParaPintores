<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Pintores</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <script defer src="/src/js/script.js"></script>
</head>
<body>
    <header>
        <img id="navIcon" src="/src/assets/navigationBar.svg" alt="navicon">
        <nav id="navBar">
            <ul>
                <li>
                    <h3>Massa Corrida</h3>
                    <input id="mc" type="number">
                </li>
                <li>
                    <h3>Tinta textura</h3>
                    <input id="tt" type="number">
                </li>
                <li>
                    <h3>Grafiato</h3>
                    <input id="g" type="number">
                </li>
                <li>
                    <h3>Tinta Acrilica</h3>
                    <input id="ta" type="number">
                </li>
            </ul>
        </nav>
    </header>
    <main id="main">
        <div id="contentMain">
            <div>
                <h2>Altura:</h2>
                <input id="width" type="number">
                <select id="larguraMedida" name="largura">
                    <option value="M">M</option>
                    <option value="Cm">Cm</option>
                    <option value="MM">MM</option>
                </select>
                <h2>Comprimento:</h2>
                <input id="length" type="number">
                <select id="comprimentoMedida" name="comprimento">
                    <option value="M">M</option>
                    <option value="Cm">Cm</option>
                    <option value="MM">MM</option>
                </select>
                <h2>Tipo da Tinta:</h2>
                <select id="typePaint" name="tintas">
                    <option value="mc">Massa Corrida</option>
                    <option value="tt">Tinta textura</option>
                    <option value="g">Grafiato</option>
                    <option value="ta">Tinta Acrilica</option>
                </select>
            </div>
            <button id="btnSubmit">Calcular</button>
        </div>
    </main>
</body>
</html>
